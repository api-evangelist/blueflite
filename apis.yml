aid: blueflite
name: blueflite
description: >-
  blueflite is a Techstars-backed unmanned aircraft systems (UAS) company that designs and
  manufactures autonomous cargo and delivery drones built on its SLATE platform for all-weather,
  time-sensitive logistics. Its aircraft target last-mile shipping and medical or life-saving
  delivery (such as defibrillators and emergency supplies), and the company complements the
  hardware with blueDelivery (a consumer ordering app), blueDigital (a cloud productivity tool),
  and blueControl, alongside drone consulting, engineering, and project services. blueflite is
  on the FAA Section 44807 approved UAS list and holds FCC conditional approval, and was founded
  by Frank Noppel and James McClearen. No public developer or API surface is currently published.
